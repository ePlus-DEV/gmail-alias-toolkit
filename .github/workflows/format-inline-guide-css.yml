name: Format inline guide CSS

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 85 && github.head_ref == 'feat/add-user-guide-links'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize inline guide action styles
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("entrypoints/content/email-helper.css")
          css = path.read_text(encoding="utf-8")

          old_block = '''.gmail-alias-popup-user-guide {
          position: relative;
          display: flex;
          width: 28px;
          height: 28px;
          box-sizing: border-box;
          align-items: center;
          justify-content: center;
          padding: 0;
          border: 1px solid #bfdbfe;
          border-radius: 7px;
          background: #eff6ff;
          color: #2563eb;
          cursor: pointer;
          text-decoration: none;
          }

          .gmail-alias-popup-user-guide:hover,
          .gmail-alias-popup-user-guide:focus-visible {
          border-color: #93c5fd;
          background: #dbeafe;
          color: #1d4ed8;
          outline: none;
          }
          '''
          old_block = "\n".join(line.lstrip() for line in old_block.splitlines())

          new_block = '''.gmail-alias-popup-user-guide {
            position: relative;
            display: flex;
            width: 28px;
            height: 28px;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #bfdbfe;
            border-radius: 7px;
            background: #eff6ff;
            color: #2563eb;
            cursor: pointer;
            text-decoration: none;
          }

          .gmail-alias-popup-user-guide:hover,
          .gmail-alias-popup-user-guide:focus-visible {
            border-color: #93c5fd;
            background: #dbeafe;
            color: #1d4ed8;
            outline: none;
          }
          '''
          new_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_block.splitlines()
          )

          if css.count(old_block) != 1:
              raise SystemExit("Expected one unformatted user-guide CSS block")
          css = css.replace(old_block, new_block, 1)

          disable_marker = '''.gmail-alias-popup-disable-site {
            position: relative;
            display: flex;
            width: 28px;
            height: 28px;
            align-items: center;
          '''
          disable_marker = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in disable_marker.splitlines()
          )
          disable_replacement = disable_marker.replace(
              "height: 28px;\n",
              "height: 28px;\n  box-sizing: border-box;\n",
          )

          if css.count(disable_marker) != 1:
              raise SystemExit("Expected one disable-site CSS marker")
          css = css.replace(disable_marker, disable_replacement, 1)
          path.write_text(css, encoding="utf-8")
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/format-inline-guide-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/content/email-helper.css
          git commit -m "style: align inline popup guide action"
          git push origin HEAD:${{ github.head_ref }}
