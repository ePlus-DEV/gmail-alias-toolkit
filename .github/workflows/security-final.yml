name: One-time Final Security Resolution

on:
  push:
    branches:
      - chore/security-audit-refresh

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: chore/security-audit-refresh
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install --global yarn@4.14.1

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Refresh final vulnerable resolution
        run: |
          yarn up -R http-cache-semantics
          yarn dedupe --strategy highest
          yarn install --mode=skip-build

      - name: Require clean moderate-or-higher audit
        run: yarn npm audit --recursive --severity moderate

      - name: Validate
        run: |
          yarn exec wxt prepare
          yarn compile
          yarn test
          yarn build
          yarn build:firefox
          node scripts/verify-manifest-scope.mjs
          yarn workspace gmail-alias-toolkit-web build

      - name: Commit final security resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-final.yml
          git add yarn.lock

          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 0
          fi

          git commit -m "chore(security): resolve final audited dependency"
          git push origin HEAD:chore/security-audit-refresh
