name: Apply inline guide link

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 85 && github.head_ref == 'feat/add-user-guide-links'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add localized guide action to inline popup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} marker, found {count}")
              return source.replace(old, new, 1)

          content_path = Path("entrypoints/content/index.ts")
          content = content_path.read_text(encoding="utf-8")

          content = replace_once(
              content,
              'import { t } from "../../lib/i18n";\n',
              'import { t } from "../../lib/i18n";\n'
              'import { getUserGuideLabel } from "src/i18n/userGuide";\n'
              'import { USER_GUIDE_URL } from "src/utils/externalLinks";\n',
              "content-script import",
          )

          content = replace_once(
              content,
              '    extensionName: escapeHtml(t("extensionName")),\n'
              '    reportReview: escapeHtml(t("reportReview")),\n',
              '    extensionName: escapeHtml(t("extensionName")),\n'
              '    userGuide: escapeHtml(getUserGuideLabel()),\n'
              '    reportReview: escapeHtml(t("reportReview")),\n',
              "localized label",
          )

          content = replace_once(
              content,
              '      <div class="gmail-alias-popup-header-actions" style="display: flex; align-items: center; gap: 6px;">\n'
              '        <button class="gmail-alias-popup-disable-site" type="button" data-tooltip="${labels.disableInlineForSite}" aria-label="${labels.disableInlineForSite}">\n',
              '      <div class="gmail-alias-popup-header-actions" style="display: flex; align-items: center; gap: 6px;">\n'
              '        <a class="gmail-alias-popup-user-guide" href="${USER_GUIDE_URL}" target="_blank" rel="noopener noreferrer" data-tooltip="${labels.userGuide}" aria-label="${labels.userGuide}">\n'
              '          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">\n'
              '            <circle cx="12" cy="12" r="10" />\n'
              '            <path d="M9.1 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4" />\n'
              '            <path d="M12 18h.01" />\n'
              '          </svg>\n'
              '        </a>\n'
              '        <button class="gmail-alias-popup-disable-site" type="button" data-tooltip="${labels.disableInlineForSite}" aria-label="${labels.disableInlineForSite}">\n',
              "inline-popup header action",
          )

          content_path.write_text(content, encoding="utf-8")

          css_path = Path("entrypoints/content/email-helper.css")
          css = css_path.read_text(encoding="utf-8")

          guide_styles = '''.gmail-alias-popup-user-guide {
            position: relative;
            display: flex;
            width: 28px;
            height: 28px;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #bfdbfe;
            border-radius: 7px;
            background: #eff6ff;
            color: #2563eb;
            cursor: pointer;
            text-decoration: none;
          }

          .gmail-alias-popup-user-guide:hover,
          .gmail-alias-popup-user-guide:focus-visible {
            border-color: #93c5fd;
            background: #dbeafe;
            color: #1d4ed8;
            outline: none;
          }

          '''
          guide_styles = "\n".join(line.lstrip() for line in guide_styles.splitlines())

          css = replace_once(
              css,
              ".gmail-alias-popup-disable-site {\n",
              guide_styles + ".gmail-alias-popup-disable-site {\n",
              "guide button styles",
          )

          css = replace_once(
              css,
              ".gmail-alias-popup-disable-site::after {\n",
              ".gmail-alias-popup-user-guide::after,\n"
              ".gmail-alias-popup-disable-site::after {\n",
              "shared tooltip styles",
          )

          css = replace_once(
              css,
              ".gmail-alias-popup-disable-site:hover::after,\n"
              ".gmail-alias-popup-disable-site:focus-visible::after {\n",
              ".gmail-alias-popup-user-guide:hover::after,\n"
              ".gmail-alias-popup-user-guide:focus-visible::after,\n"
              ".gmail-alias-popup-disable-site:hover::after,\n"
              ".gmail-alias-popup-disable-site:focus-visible::after {\n",
              "shared tooltip visibility",
          )

          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-inline-guide-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/content/index.ts entrypoints/content/email-helper.css
          git commit -m "feat: add user guide link to inline popup"
          git push origin HEAD:${{ github.head_ref }}
