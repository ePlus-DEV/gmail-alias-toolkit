name: Migrate user guide translations to WXT locales

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.number == 85 && github.head_ref == 'feat/add-user-guide-links'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Migrate translations
        run: python3 .github/scripts/migrate-user-guide-locales.py

      - name: Validate generated locale files
        run: node -e 'const fs=require("fs"); for (const locale of fs.readdirSync("public/_locales")) JSON.parse(fs.readFileSync(`public/_locales/${locale}/messages.json`, "utf8"));'

      - name: Commit migration and remove temporary files
        run: |
          git rm .github/workflows/migrate-user-guide-locales.yml
          git rm .github/scripts/migrate-user-guide-locales.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use WXT locales for user guide labels"
          git push origin HEAD:${{ github.head_ref }}
