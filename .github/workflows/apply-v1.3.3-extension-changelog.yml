name: Apply v1.3.3 extension changelog

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 88 && github.head_ref == 'release/v1.3.3-workspace-alias-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore repository changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- CHANGELOG.md

      - name: Update extension changelog
        run: python3 scripts/patch-v1.3.3-extension-changelog.py

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable --mode=skip-build
          yarn exec wxt prepare
          yarn compile --pretty false
          yarn test

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-v1.3.3-extension-changelog.yml \
            scripts/patch-v1.3.3-extension-changelog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            entrypoints/popup/components/Settings.tsx
          git commit -m "release: add v1.3.3 extension changelog"
          git push origin HEAD:${{ github.head_ref }}
