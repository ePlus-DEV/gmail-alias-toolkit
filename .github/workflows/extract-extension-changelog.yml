name: Extract extension changelog data

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 88 && github.head_ref == 'release/v1.3.3-workspace-alias-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Extract changelog data from Settings
        run: python3 scripts/extract-extension-changelog.py

      - name: Validate refactor
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable --mode=skip-build
          yarn exec wxt prepare
          yarn compile --pretty false
          yarn test

      - name: Commit refactor and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/extract-extension-changelog.yml \
            scripts/extract-extension-changelog.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            entrypoints/popup/components/Settings.tsx \
            entrypoints/popup/data/changelog.ts \
            tests/popup/changelogData.test.ts
          git commit -m "refactor: separate extension changelog data"
          git push origin HEAD:${{ github.head_ref }}
