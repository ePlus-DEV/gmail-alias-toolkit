name: Apply extension changelog update

on:
  push:
    branches:
      - feat/update-extension-changelog-sites-pagination

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip apply-update]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/update-extension-changelog-sites-pagination

      - name: Patch settings and landing version
        run: |
          python3 <<'PY'
          from pathlib import Path

          settings_path = Path("entrypoints/popup/components/Settings.tsx")
          settings = settings_path.read_text()

          import_line = 'import Input from "./Input";\n'
          import_replacement = (
              'import Input from "./Input";\n'
              'import DisabledInlineSitesPanel from "./DisabledInlineSitesPanel";\n'
          )
          if settings.count(import_line) != 1:
              raise SystemExit("Unexpected Settings Input import count")
          settings = settings.replace(import_line, import_replacement, 1)

          changelog_marker = '''  {
              version: "1.3.0",
              date: "2026-07-13",
          '''
          changelog_entries = '''  {
              version: "1.3.2",
              date: "2026-07-24",
              changes: [
                {
                  type: "Added",
                  items: [
                    "Added generated-manifest scope verification with regression coverage for Chrome and Firefox-style permissions",
                  ],
                },
                {
                  type: "Changed",
                  items: [
                    "Aligned WXT development and production URL-scope handling",
                    "Restricted development builds to the configured site allowlist while preserving all-site production support",
                  ],
                },
                {
                  type: "Fixed",
                  items: [
                    "Restored inline popup availability in production builds",
                    "Prevented unrelated content scripts and broad development URL patterns from passing manifest validation",
                  ],
                },
              ],
            },
            {
              version: "1.3.1",
              date: "2026-07-20",
              changes: [
                {
                  type: "Added",
                  items: [
                    "Added Edge and Opera release packages with multi-browser installation guidance",
                    "Added an interactive product tour and richer landing-page previews",
                  ],
                },
                {
                  type: "Changed",
                  items: [
                    "Improved active email handling across the popup, inline helper, and context menus",
                    "Optimized inline popup behavior and displayed the active base email",
                  ],
                },
                {
                  type: "Fixed",
                  items: [
                    "Improved user feedback when disabling the inline helper or saving aliases",
                    "Fixed context-menu caching, history loading, injected icon cleanup, and development-site configuration",
                  ],
                },
              ],
            },
          ''' + changelog_marker
          if settings.count(changelog_marker) != 1:
              raise SystemExit("Unexpected changelog marker count")
          settings = settings.replace(changelog_marker, changelog_entries, 1)

          fallback = 'const [version, setVersion] = useState("1.3.0");'
          if settings.count(fallback) != 1:
              raise SystemExit("Unexpected fallback version count")
          settings = settings.replace(
              fallback,
              'const [version, setVersion] = useState("1.3.2");',
              1,
          )

          old_panel = '''                  description: (
                    <div className="space-y-3">
                      <p className="text-xs text-muted-foreground">
                        {t("inlineDisabledSitesDescription")}
                      </p>
                      {disabledInlineSites.length === 0 ? (
                        <p className="rounded-xl border border-dashed border-border px-3 py-3 text-center text-xs text-muted-foreground">
                          {t("noDisabledSites")}
                        </p>
                      ) : (
                        <div className="max-h-36 space-y-1.5 overflow-y-auto">
                          {disabledInlineSites.map((site) => (
                            <div
                              key={site}
                              className="flex items-center justify-between gap-2 rounded-xl border border-border bg-muted/45 px-3 py-2"
                            >
                              <span className="min-w-0 truncate font-mono text-xs text-foreground">
                                {site}
                              </span>
                              <Button
                                variant="ghost"
                                size="sm"
                                className="shrink-0 rounded-lg px-2 text-xs text-primary hover:bg-primary/10"
                                onClick={() => enableInlineForSite(site)}
                                aria-label={`${t("enableInlineForSite")}: ${site}`}
                              >
                                {t("enableInlineForSite")}
                              </Button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ),'''
          new_panel = '''                  description: (
                    <div className="space-y-3">
                      <p className="text-xs text-muted-foreground">
                        {t("inlineDisabledSitesDescription")}
                      </p>
                      <DisabledInlineSitesPanel
                        sites={disabledInlineSites}
                        onEnable={enableInlineForSite}
                      />
                    </div>
                  ),'''
          if settings.count(old_panel) != 1:
              raise SystemExit("Unexpected disabled-sites panel count")
          settings = settings.replace(old_panel, new_panel, 1)
          settings_path.write_text(settings)

          web_path = Path("web/src/App.tsx")
          web = web_path.read_text()
          if web.count("v1.3.0") != 1:
              raise SystemExit("Unexpected landing version count")
          web_path.write_text(web.replace("v1.3.0", "v1.3.2", 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-changelog-sites-update.yml

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/popup/components/Settings.tsx web/src/App.tsx .github/workflows/apply-changelog-sites-update.yml
          git commit -m "feat: update changelog and disabled-sites UI [skip apply-update]"
          git push origin HEAD:feat/update-extension-changelog-sites-pagination
