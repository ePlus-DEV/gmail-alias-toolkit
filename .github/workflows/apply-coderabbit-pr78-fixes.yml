name: Apply CodeRabbit PR 78 fixes

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apply-coderabbit-pr78-fixes.yml"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Verify bot token
        env:
          EPLUS_BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EPLUS_BOT_TOKEN:-}"
          test "$(GH_TOKEN="$EPLUS_BOT_TOKEN" gh api user --jq .login)" = "eplus-bot"

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.EPLUS_BOT_TOKEN }}

      - name: Patch CodeRabbit findings
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          preview = Path(".github/workflows/pr-preview.yml")
          text = preview.read_text()
          old = '''    runs-on: ubuntu-latest
              env:
                GITHUB_TOKEN: ${{ github.token }}

              steps:
          '''
          # Keep the expression literal instead of letting this workflow interpolate it.
          token_expression = "$" + "{{ github.token }}"
          old = old.replace("${{ github.token }}", token_expression)
          new = '''    runs-on: ubuntu-latest

              steps:
          '''
          if old not in text:
              raise SystemExit("Expected job-level GITHUB_TOKEN block was not found")
          text = text.replace(old, new, 1)

          old = '''      - name: Build production site
                working-directory: main-site
                run: |
          '''
          new = f'''      - name: Build production site
                working-directory: main-site
                env:
                  GITHUB_TOKEN: {token_expression}
                run: |
          '''
          if old not in text:
              raise SystemExit("Expected production build step was not found")
          preview.write_text(text.replace(old, new, 1))

          content = Path("entrypoints/content/index.ts")
          text = content.read_text()
          old = '''export default defineContentScript({
            matches: ["<all_urls>"],
            allFrames: true,
            matchAboutBlank: true,
          '''
          new = '''export default defineContentScript({
            matches: ["<all_urls>"],
            // Keep the helper in the top document so third-party embedded frames
            // cannot receive alias suggestions or extension UI.
          '''
          if old not in text:
              raise SystemExit("Expected all-frame content-script configuration was not found")
          content.write_text(text.replace(old, new, 1))

          release = Path("web/release-version.ts")
          text = release.read_text()
          old = '''export const LATEST_RELEASE_API_URL =
            "https://api.github.com/repos/ePlus-DEV/gmail-alias-toolkit/releases/latest";

          const SEMVER_PATTERN =
          '''
          new = '''export const LATEST_RELEASE_API_URL =
            "https://api.github.com/repos/ePlus-DEV/gmail-alias-toolkit/releases/latest";
          export const RELEASE_FETCH_TIMEOUT_MS = 5_000;

          const SEMVER_PATTERN =
          '''
          if old not in text:
              raise SystemExit("Expected release API constant block was not found")
          text = text.replace(old, new, 1)

          old = '''    const response = await fetcher(LATEST_RELEASE_API_URL, { headers });
          '''
          new = '''    const response = await fetcher(LATEST_RELEASE_API_URL, {
              headers,
              signal: AbortSignal.timeout(RELEASE_FETCH_TIMEOUT_MS),
            });
          '''
          if old not in text:
              raise SystemExit("Expected unbounded release fetch was not found")
          release.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/apply-coderabbit-pr78-fixes.yml

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn

      - name: Validate changes
        run: |
          set -euo pipefail
          yarn install --immutable --mode=skip-build
          yarn exec wxt prepare
          yarn compile
          yarn test
          yarn build
          yarn workspace gmail-alias-toolkit-web build

      - name: Commit fixes
        env:
          EPLUS_BOT_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add .github/workflows/pr-preview.yml entrypoints/content/index.ts web/release-version.ts
          git add -u .github/workflows/apply-coderabbit-pr78-fixes.yml
          git commit -m "fix: address CodeRabbit release findings"
          git push origin HEAD:dev
