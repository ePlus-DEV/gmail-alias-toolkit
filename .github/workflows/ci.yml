name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: Integrate Phase Two
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ github.token }}

      - name: Integrate product tour
        shell: python
        run: |
          from pathlib import Path

          app = Path("web/src/App.tsx")
          text = app.read_text(encoding="utf-8")
          import_line = 'import { PhaseTwoSections } from "./PhaseTwoSections";\n'
          anchor = 'import { ThemeToggle } from "src/components/motion/theme-toggle";\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit("App import anchor not found")
              text = text.replace(anchor, anchor + import_line, 1)

          old = '      <TricksSection t={copy} />\n      <PrivacySection t={copy} />'
          new = '      <TricksSection t={copy} />\n      <PhaseTwoSections locale={locale} />\n      <PrivacySection t={copy} />'
          if new not in text:
              if old not in text:
                  raise SystemExit("App section anchor not found")
              text = text.replace(old, new, 1)
          app.write_text(text, encoding="utf-8")

          enhancements = Path("web/src/site-enhancements.ts")
          text = enhancements.read_text(encoding="utf-8")
          replacements = {
              '      features: "Tính năng",\n      privacy: "Quyền riêng tư",': '      features: "Tính năng",\n      tour: "Product Tour",\n      manual: "Cài đặt thủ công",\n      privacy: "Quyền riêng tư",',
              '      features: "Features",\n      privacy: "Privacy",': '      features: "Features",\n      tour: "Product tour",\n      manual: "Manual installation",\n      privacy: "Privacy",',
              '          <button type="button" data-scroll="#features">${text.nav.features}</button>\n          <button type="button" data-scroll="#privacy">${text.nav.privacy}</button>': '          <button type="button" data-scroll="#features">${text.nav.features}</button>\n          <button type="button" data-scroll="#product-tour">${text.nav.tour}</button>\n          <button type="button" data-scroll="#manual-install">${text.nav.manual}</button>\n          <button type="button" data-scroll="#privacy">${text.nav.privacy}</button>',
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Enhancement anchor not found: {old[:50]}")
              text = text.replace(old, new, 1)
          enhancements.write_text(text, encoding="utf-8")

      - name: Restore CI and commit
        run: |
          corepack enable
          yarn prettier --write web/src/App.tsx web/src/PhaseTwoSections.tsx web/src/site-enhancements.ts
          rm -f .github/workflows/one-time-phase-two.yml scripts/trigger-phase-two
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          concurrency:
            group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          jobs:
            ci:
              name: Compile, Test, Build
              runs-on: ubuntu-latest

              steps:
                - name: Checkout code
                  uses: actions/checkout@v7

                - name: Validate GitHub Actions workflows
                  env:
                    ACTIONLINT_VERSION: 1.7.12
                    ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
                  run: |
                    set -euo pipefail
                    curl -fsSL \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
                      -o actionlint.tar.gz
                    echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
                    tar -xzf actionlint.tar.gz actionlint
                    ./actionlint -shellcheck= -pyflakes= -color

                - name: Enable Corepack
                  run: corepack enable

                - name: Setup Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24.x
                    cache: yarn
                    cache-dependency-path: yarn.lock

                - name: Install dependencies
                  run: yarn install --immutable --mode=skip-build

                - name: Prepare WXT types
                  run: yarn exec wxt prepare

                - name: Compile TypeScript
                  id: compile
                  continue-on-error: true
                  shell: bash
                  run: |
                    set -o pipefail
                    yarn compile --pretty false 2>&1 | tee compile.log

                - name: Upload TypeScript diagnostics
                  if: steps.compile.outcome == 'failure'
                  uses: actions/upload-artifact@v7
                  with:
                    name: typescript-diagnostics
                    path: compile.log
                    if-no-files-found: error

                - name: Fail on TypeScript errors
                  if: steps.compile.outcome == 'failure'
                  run: exit 1

                - name: Run tests
                  run: yarn test

                - name: Build extension
                  run: yarn build

                - name: Build website
                  run: yarn workspace gmail-alias-toolkit-web build
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(web): integrate phase two product tour"
          git push origin HEAD:dev
