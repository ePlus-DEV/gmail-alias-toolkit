name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: feat/update-extension-changelog-sites-pagination
          token: ${{ secrets.EPLUS_BOT_TOKEN }}

      - name: Apply extension changelog and disabled-site UI
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/update-extension-changelog-sites-pagination' }}
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          settings_path = Path("entrypoints/popup/components/Settings.tsx")
          settings = settings_path.read_text()

          input_import = 'import Input from "./Input";\n'
          panel_import = 'import DisabledInlineSitesPanel from "./DisabledInlineSitesPanel";\n'
          if panel_import not in settings:
              if settings.count(input_import) != 1:
                  raise SystemExit("Unexpected Settings input import count")
              settings = settings.replace(input_import, input_import + panel_import, 1)

          changelog_marker = (
              '  {\n'
              '    version: "1.3.0",\n'
              '    date: "2026-07-13",\n'
          )
          changelog_entries = (
              '  {\n'
              '    version: "1.3.2",\n'
              '    date: "2026-07-24",\n'
              '    changes: [\n'
              '      {\n'
              '        type: "Added",\n'
              '        items: [\n'
              '          "Added generated-manifest scope verification with regression coverage for Chrome and Firefox-style permissions",\n'
              '        ],\n'
              '      },\n'
              '      {\n'
              '        type: "Changed",\n'
              '        items: [\n'
              '          "Aligned WXT development and production URL-scope handling",\n'
              '          "Restricted development builds to the configured site allowlist while preserving all-site production support",\n'
              '        ],\n'
              '      },\n'
              '      {\n'
              '        type: "Fixed",\n'
              '        items: [\n'
              '          "Restored inline popup availability in production builds",\n'
              '          "Prevented unrelated content scripts and broad development URL patterns from passing manifest validation",\n'
              '        ],\n'
              '      },\n'
              '    ],\n'
              '  },\n'
              '  {\n'
              '    version: "1.3.1",\n'
              '    date: "2026-07-20",\n'
              '    changes: [\n'
              '      {\n'
              '        type: "Added",\n'
              '        items: [\n'
              '          "Added Edge and Opera release packages with multi-browser installation guidance",\n'
              '          "Added an interactive product tour and richer landing-page previews",\n'
              '        ],\n'
              '      },\n'
              '      {\n'
              '        type: "Changed",\n'
              '        items: [\n'
              '          "Improved active email handling across the popup, inline helper, and context menus",\n'
              '          "Optimized inline popup behavior and displayed the active base email",\n'
              '        ],\n'
              '      },\n'
              '      {\n'
              '        type: "Fixed",\n'
              '        items: [\n'
              '          "Improved user feedback when disabling the inline helper or saving aliases",\n'
              '          "Fixed context-menu caching, history loading, injected icon cleanup, and development-site configuration",\n'
              '        ],\n'
              '      },\n'
              '    ],\n'
              '  },\n'
              + changelog_marker
          )
          if 'version: "1.3.2"' not in settings:
              if settings.count(changelog_marker) != 1:
                  raise SystemExit("Unexpected changelog marker count")
              settings = settings.replace(changelog_marker, changelog_entries, 1)

          fallback_version = 'const [version, setVersion] = useState("1.3.0");'
          if fallback_version in settings:
              settings = settings.replace(
                  fallback_version,
                  'const [version, setVersion] = useState("1.3.2");',
                  1,
              )

          inline_section = settings.index(
              '                {\n                  id: "inline-helper-sites",'
          )
          next_section = settings.index(
              '                {\n                  id: "alias-generation",',
              inline_section,
          )
          description_start = settings.index(
              '                  description: (',
              inline_section,
              next_section,
          )
          description_end = settings.rfind(
              '                  ),',
              description_start,
              next_section,
          )
          if description_end == -1:
              raise SystemExit("Disabled-sites description end was not found")
          description_end += len('                  ),')

          new_description = (
              '                  description: (\n'
              '                    <div className="space-y-3">\n'
              '                      <p className="text-xs text-muted-foreground">\n'
              '                        {t("inlineDisabledSitesDescription")}\n'
              '                      </p>\n'
              '                      <DisabledInlineSitesPanel\n'
              '                        sites={disabledInlineSites}\n'
              '                        onEnable={enableInlineForSite}\n'
              '                      />\n'
              '                    </div>\n'
              '                  ),'
          )
          settings = (
              settings[:description_start]
              + new_description
              + settings[description_end:]
          )
          settings_path.write_text(settings)

          web_path = Path("web/src/App.tsx")
          web = web_path.read_text()
          if "v1.3.2" not in web:
              if web.count("v1.3.0") != 1:
                  raise SystemExit("Unexpected landing version count")
              web_path.write_text(web.replace("v1.3.0", "v1.3.2", 1))
          PY

          rm -f .github/workflows/apply-changelog-sites-update.yml
          rm -f .github/.apply-changelog-trigger

          git fetch origin dev:refs/remotes/origin/dev
          git checkout origin/dev -- .github/workflows/ci.yml

          if git diff --quiet; then
            echo "No extension UI update was required."
            exit 0
          fi

          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: update changelog and disabled-sites UI"
          git push origin HEAD:feat/update-extension-changelog-sites-pagination

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes= -color

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build production extension
        run: yarn build

      - name: Verify production inline helper scope
        run: node scripts/verify-manifest-scope.mjs production chrome

      - name: Build website
        run: yarn workspace gmail-alias-toolkit-web build
