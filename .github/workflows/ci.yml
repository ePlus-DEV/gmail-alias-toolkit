name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply remaining reviewed fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'dev'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence in {path}, found {count}: {old[:100]!r}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          background_path = Path("entrypoints/background.ts")
          background = background_path.read_text(encoding="utf-8")
          if "const dynamicContextMenus" not in background:
              replace_once(
                  "entrypoints/background.ts",
                  '''  // Update website suggestions when context menu is shown
            browser.contextMenus.onShown?.addListener?.(async (info) => {''',
                  '''  // Chromium exposes dynamic context-menu hooks that are missing from
            // some WebExtension type definitions used by WXT.
            const dynamicContextMenus = browser.contextMenus as typeof browser.contextMenus & {
              onShown?: {
                addListener(
                  listener: (info: { pageUrl?: string }) => void | Promise<void>,
                ): void;
              };
              refresh?: () => void | Promise<void>;
            };

            // Update website suggestions when the context menu is shown.
            dynamicContextMenus.onShown?.addListener(async (info) => {''',
              )

              replace_once(
                  "entrypoints/background.ts",
                  '''      // Remove placeholder and add suggestions
                  await browser.contextMenus.remove("website-loading");

                  suggestions.slice(0, 3).forEach((suggestion, index) => {
                    browser.contextMenus.create({
                      id: `website-suggestion-${index}`,
                      parentId: "website-alias-parent",
                      title: suggestion.split("@")[0],
                      contexts: ["editable"],
                    });
                  });

                  await browser.contextMenus.refresh?.();''',
                  '''      // Rebuild dynamic items safely. Repeated menu openings otherwise
                  // reuse the same IDs and leave stale suggestions behind.
                  const dynamicItemIds = [
                    "website-loading",
                    "website-suggestion-0",
                    "website-suggestion-1",
                    "website-suggestion-2",
                  ];
                  await Promise.all(
                    dynamicItemIds.map(async (id) => {
                      try {
                        await browser.contextMenus.remove(id);
                      } catch {
                        // The item may not exist on the first or a later menu opening.
                      }
                    }),
                  );

                  for (const [index, suggestion] of suggestions
                    .slice(0, 3)
                    .entries()) {
                    browser.contextMenus.create({
                      id: `website-suggestion-${index}`,
                      parentId: "website-alias-parent",
                      title: suggestion.split("@")[0],
                      contexts: ["editable"],
                    });
                  }

                  await dynamicContextMenus.refresh?.();''',
              )

          test_path = Path("tests/services/websiteAliasService.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          if 'vi.stubGlobal("browser"' not in test_text:
              replace_once(
                  "tests/services/websiteAliasService.test.ts",
                  "global.browser = {",
                  'vi.stubGlobal("browser", {',
              )
              replace_once(
                  "tests/services/websiteAliasService.test.ts",
                  "} as unknown as MockBrowser;",
                  "} as unknown as MockBrowser);",
              )

          temporary_workflow = Path(".github/workflows/apply-typescript-fixes.yml")
          if temporary_workflow.exists():
              temporary_workflow.unlink()
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: resolve TypeScript compile errors"
            git push origin HEAD:dev
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build extension
        run: yarn build
