name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: feat/update-extension-changelog-sites-pagination
          token: ${{ secrets.EPLUS_BOT_TOKEN }}

      - name: Apply extension changelog and disabled-site UI
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/update-extension-changelog-sites-pagination' }}
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          settings_path = Path("entrypoints/popup/components/Settings.tsx")
          settings = settings_path.read_text()

          input_import = 'import Input from "./Input";\n'
          panel_import = 'import DisabledInlineSitesPanel from "./DisabledInlineSitesPanel";\n'
          if panel_import not in settings:
              if settings.count(input_import) != 1:
                  raise SystemExit("Unexpected Settings input import count")
              settings = settings.replace(
                  input_import,
                  input_import + panel_import,
                  1,
              )

          changelog_marker = '''  {
            version: "1.3.0",
            date: "2026-07-13",
          '''
          changelog_entries = '''  {
            version: "1.3.2",
            date: "2026-07-24",
            changes: [
              {
                type: "Added",
                items: [
                  "Added generated-manifest scope verification with regression coverage for Chrome and Firefox-style permissions",
                ],
              },
              {
                type: "Changed",
                items: [
                  "Aligned WXT development and production URL-scope handling",
                  "Restricted development builds to the configured site allowlist while preserving all-site production support",
                ],
              },
              {
                type: "Fixed",
                items: [
                  "Restored inline popup availability in production builds",
                  "Prevented unrelated content scripts and broad development URL patterns from passing manifest validation",
                ],
              },
            ],
          },
          {
            version: "1.3.1",
            date: "2026-07-20",
            changes: [
              {
                type: "Added",
                items: [
                  "Added Edge and Opera release packages with multi-browser installation guidance",
                  "Added an interactive product tour and richer landing-page previews",
                ],
              },
              {
                type: "Changed",
                items: [
                  "Improved active email handling across the popup, inline helper, and context menus",
                  "Optimized inline popup behavior and displayed the active base email",
                ],
              },
              {
                type: "Fixed",
                items: [
                  "Improved user feedback when disabling the inline helper or saving aliases",
                  "Fixed context-menu caching, history loading, injected icon cleanup, and development-site configuration",
                ],
              },
            ],
          },
          ''' + changelog_marker
          if 'version: "1.3.2"' not in settings:
              if settings.count(changelog_marker) != 1:
                  raise SystemExit("Unexpected changelog marker count")
              settings = settings.replace(
                  changelog_marker,
                  changelog_entries,
                  1,
              )

          settings = settings.replace(
              'const [version, setVersion] = useState("1.3.0");',
              'const [version, setVersion] = useState("1.3.2");',
              1,
          )

          inline_section = settings.index(
              '                {\n                  id: "inline-helper-sites",'
          )
          next_section = settings.index(
              '                {\n                  id: "alias-generation",',
              inline_section,
          )
          description_start = settings.index(
              '                  description: (',
              inline_section,
              next_section,
          )
          description_end = settings.rfind(
              '                  ),',
              description_start,
              next_section,
          )
          if description_end == -1:
              raise SystemExit("Disabled-sites description end was not found")
          description_end += len('                  ),')

          new_description = '''                  description: (
                    <div className="space-y-3">
                      <p className="text-xs text-muted-foreground">
                        {t("inlineDisabledSitesDescription")}
                      </p>
                      <DisabledInlineSitesPanel
                        sites={disabledInlineSites}
                        onEnable={enableInlineForSite}
                      />
                    </div>
                  ),'''
          settings = (
              settings[:description_start]
              + new_description
              + settings[description_end:]
          )
          settings_path.write_text(settings)

          web_path = Path("web/src/App.tsx")
          web = web_path.read_text()
          if "v1.3.2" not in web:
              if web.count("v1.3.0") != 1:
                  raise SystemExit("Unexpected landing version count")
              web = web.replace("v1.3.0", "v1.3.2", 1)
              web_path.write_text(web)
          PY

          rm -f .github/workflows/apply-changelog-sites-update.yml
          rm -f .github/.apply-changelog-trigger

          git fetch origin dev
          git checkout origin/dev -- .github/workflows/ci.yml

          if git diff --quiet; then
            echo "No extension UI update was required."
            exit 0
          fi

          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/apply-changelog-sites-update.yml \
            .github/.apply-changelog-trigger \
            entrypoints/popup/components/Settings.tsx \
            web/src/App.tsx
          git commit -m "feat: update changelog and disabled-sites UI"
          git push origin HEAD:feat/update-extension-changelog-sites-pagination

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes= -color

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build production extension
        run: yarn build

      - name: Verify production inline helper scope
        run: node scripts/verify-manifest-scope.mjs production chrome

      - name: Build website
        run: yarn workspace gmail-alias-toolkit-web build
