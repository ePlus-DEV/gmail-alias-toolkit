name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: feat/update-extension-changelog-sites-pagination
          token: ${{ secrets.EPLUS_BOT_TOKEN }}

      - name: Replace hardcoded user-facing versions
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/update-extension-changelog-sites-pagination' }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          settings_path = Path("entrypoints/popup/components/Settings.tsx")
          settings = settings_path.read_text()
          version_import = 'import { APP_VERSION } from "src/version";\n'
          import_anchor = 'import { t } from "../../../lib/i18n";\n'
          if version_import not in settings:
              if settings.count(import_anchor) != 1:
                  raise SystemExit("Unexpected Settings import anchor count")
              settings = settings.replace(
                  import_anchor,
                  import_anchor + version_import,
                  1,
              )

          fallback = 'const [version, setVersion] = useState("1.3.2");'
          dynamic_fallback = 'const [version, setVersion] = useState(APP_VERSION);'
          if dynamic_fallback not in settings:
              if settings.count(fallback) != 1:
                  raise SystemExit("Unexpected Settings version fallback count")
              settings = settings.replace(fallback, dynamic_fallback, 1)
          settings_path.write_text(settings)

          web_path = Path("web/src/App.tsx")
          web = web_path.read_text()
          if version_import not in web:
              web_anchor = 'import { ThemeToggle } from "src/components/motion/theme-toggle";\n'
              if web.count(web_anchor) != 1:
                  raise SystemExit("Unexpected web import anchor count")
              web = web.replace(web_anchor, web_anchor + version_import, 1)

          if "v{APP_VERSION}" not in web:
              if web.count("v1.3.2") != 1:
                  raise SystemExit("Unexpected hardcoded web version count")
              web = web.replace("v1.3.2", "v{APP_VERSION}", 1)
          web_path.write_text(web)
          PY

          git fetch origin dev
          git checkout origin/dev -- .github/workflows/ci.yml

          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            entrypoints/popup/components/Settings.tsx \
            web/src/App.tsx
          git commit -m "refactor: source displayed version from package metadata"
          git push origin HEAD:feat/update-extension-changelog-sites-pagination

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes= -color

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build production extension
        run: yarn build

      - name: Verify production inline helper scope
        run: node scripts/verify-manifest-scope.mjs production chrome

      - name: Build website
        run: yarn workspace gmail-alias-toolkit-web build
