name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout PR branch for changelog update
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ github.token }}

      - name: Commit changelog for 1.3.1
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 67
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          heading = "## [1.3.1] - 2026-07-20"
          marker = "## [1.3.0] - 2026-07-15"

          if heading in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit("Could not find the 1.3.0 changelog heading")

          entry = """## [1.3.1] - 2026-07-20

          ### :sparkles: New Features

          - Added a **Main Account** option to the inline suggestions popup, allowing users to preview and select their original Gmail address.
          - Added per-page website suggestion caching scoped to both the current page and active Gmail account.

          ### :bug: Bug Fixes

          - Improved website suggestion, alias history, badge, and storage failure handling while keeping user-facing retry and error feedback.
          - Improved inline helper cleanup to prevent duplicate icons, observers, and event listeners after partial initialization failures.
          - Improved email input detection and removed unnecessary periodic scanning for better reliability and performance.
          - Fixed unsafe nullable icon state handling that caused DeepSource JavaScript checks to fail.

          ### :art: User Interface

          - Added a visible error state when an alias is filled successfully but could not be saved.
          - Improved the disable-on-site interaction and displayed clearer website suggestion labels.

          ### :wrench: Maintenance

          - Updated the extension package version to `1.3.1`.
          - Updated development and production site permissions.
          - Reduced unnecessary console noise and refactored shared active-account resolution logic.

          """

          entry = "\n".join(line[10:] if line.startswith("          ") else line for line in entry.splitlines()) + "\n"
          path.write_text(text.replace(marker, entry + marker, 1), encoding="utf-8")
          PY

          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add changelog for 1.3.1"
          git push origin HEAD:dev

      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= -pyflakes= -color

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build extension
        run: yarn build

      - name: Build website
        run: yarn workspace gmail-alias-toolkit-web build
