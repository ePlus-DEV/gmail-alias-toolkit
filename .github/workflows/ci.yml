name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply remaining reviewed fixes
        if: github.event_name == 'pull_request' && github.head_ref == 'dev'
        shell: bash
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          background_path = Path("entrypoints/background.ts")
          background = background_path.read_text(encoding="utf-8")

          if "const dynamicContextMenus" not in background:
              old_listener = "browser.contextMenus.onShown?.addListener?.(async (info) => {"
              if background.count(old_listener) != 1:
                  raise SystemExit(
                      f"Expected one contextMenus.onShown listener, found {background.count(old_listener)}"
                  )

              listener_replacement = '''const dynamicContextMenus = browser.contextMenus as typeof browser.contextMenus & {
            onShown?: {
              addListener(
                listener: (info: { pageUrl?: string }) => void | Promise<void>,
              ): void;
            };
            refresh?: () => void | Promise<void>;
          };

          // Update website suggestions when the context menu is shown.
          dynamicContextMenus.onShown?.addListener(async (info) => {'''
              background = background.replace(
                  old_listener,
                  listener_replacement,
                  1,
              )

              dynamic_block_pattern = re.compile(
                  r'''\s*// Remove placeholder and add suggestions\n'''
                  r'''\s*await browser\.contextMenus\.remove\("website-loading"\);\n'''
                  r'''\s*suggestions\.slice\(0, 3\)\.forEach\(\(suggestion, index\) => \{\n'''
                  r'''\s*browser\.contextMenus\.create\(\{\n'''
                  r'''\s*id: `website-suggestion-\$\{index\}`,\n'''
                  r'''\s*parentId: "website-alias-parent",\n'''
                  r'''\s*title: suggestion\.split\("@"\)\[0\],\n'''
                  r'''\s*contexts: \["editable"\],\n'''
                  r'''\s*\}\);\n'''
                  r'''\s*\}\);\n'''
                  r'''\s*await browser\.contextMenus\.refresh\?\.\(\);''',
                  re.MULTILINE,
              )
              dynamic_block_replacement = '''
              // Rebuild dynamic items safely. Repeated menu openings otherwise
              // reuse the same IDs and leave stale suggestions behind.
              const dynamicItemIds = [
                "website-loading",
                "website-suggestion-0",
                "website-suggestion-1",
                "website-suggestion-2",
              ];
              await Promise.all(
                dynamicItemIds.map(async (id) => {
                  try {
                    await browser.contextMenus.remove(id);
                  } catch {
                    // The item may not exist on the first or a later menu opening.
                  }
                }),
              );

              for (const [index, suggestion] of suggestions.slice(0, 3).entries()) {
                browser.contextMenus.create({
                  id: `website-suggestion-${index}`,
                  parentId: "website-alias-parent",
                  title: suggestion.split("@")[0],
                  contexts: ["editable"],
                });
              }

              await dynamicContextMenus.refresh?.();'''
              background, replacements = dynamic_block_pattern.subn(
                  dynamic_block_replacement,
                  background,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(
                      f"Expected one dynamic context-menu block, replaced {replacements}"
                  )

              background_path.write_text(background, encoding="utf-8")

          test_path = Path("tests/services/websiteAliasService.test.ts")
          test_text = test_path.read_text(encoding="utf-8")
          if 'vi.stubGlobal("browser"' not in test_text:
              if test_text.count("global.browser = {") != 1:
                  raise SystemExit("Unable to locate global.browser assignment")
              if test_text.count("} as unknown as MockBrowser;") != 1:
                  raise SystemExit("Unable to locate MockBrowser assignment terminator")
              test_text = test_text.replace(
                  "global.browser = {",
                  'vi.stubGlobal("browser", {',
                  1,
              )
              test_text = test_text.replace(
                  "} as unknown as MockBrowser;",
                  "} as unknown as MockBrowser);",
                  1,
              )
              test_path.write_text(test_text, encoding="utf-8")

          temporary_workflow = Path(".github/workflows/apply-typescript-fixes.yml")
          if temporary_workflow.exists():
              temporary_workflow.unlink()
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: resolve TypeScript compile errors"
            git push origin HEAD:dev
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build extension
        run: yarn build
