name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Compile, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Prepare WXT types
        run: yarn exec wxt prepare

      - name: Compile TypeScript
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          yarn compile --pretty false 2>&1 | tee compile.log

      - name: Upload TypeScript diagnostics
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: typescript-diagnostics
          path: compile.log
          if-no-files-found: error

      - name: Fail on TypeScript errors
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: yarn test

      - name: Build extension
        run: yarn build
