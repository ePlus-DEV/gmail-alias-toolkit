name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: Revert manual changelog update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ github.token }}

      - name: Restore release-managed changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          start = "## [1.3.1] - 2026-07-20\n"
          end = "## [1.3.0] - 2026-07-15\n"

          if start not in text:
              raise SystemExit(0)
          before, remainder = text.split(start, 1)
          if end not in remainder:
              raise SystemExit("Could not find the previous changelog section")
          _, after = remainder.split(end, 1)
          path.write_text(before + end + after, encoding="utf-8")
          PY

          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "revert: keep changelog release-managed"
          git push origin HEAD:dev
