name: One-time align WXT mode

on:
  push:
    branches:
      - agent/cleanup-wxt-environment-checks

permissions:
  contents: write

jobs:
  align-mode:
    name: Use WXT runtime mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: agent/cleanup-wxt-environment-checks
          fetch-depth: 0

      - name: Align runtime and manifest modes
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import re
          from pathlib import Path

          content_script = Path("entrypoints/content/index.ts")
          workflow = Path(".github/workflows/one-time-align-wxt-mode.yml")
          source = content_script.read_text(encoding="utf-8")
          pattern = re.compile(
              r'const contentScriptMatches\s*=\s*import\.meta\.env\.DEV\s*\?\s*DEV_SITES\s*:\s*\["<all_urls>"\];'
          )
          replacement = (
              'const contentScriptMatches =\n'
              '  import.meta.env.MODE === "development" ? DEV_SITES : ["<all_urls>"];'
          )
          updated, replacements = pattern.subn(replacement, source)

          if replacements != 1:
              raise SystemExit(
                  f"Expected exactly one import.meta.env.DEV scope check, found {replacements}"
              )

          content_script.write_text(updated, encoding="utf-8")
          workflow.unlink()
          PY

          if grep -RIn --exclude-dir=.git --exclude='CHANGELOG.md' '__DEV_MODE__\|import\.meta\.env\.DEV' .; then
            echo 'Legacy development checks remain.' >&2
            exit 1
          fi

          git diff --check

      - name: Commit aligned mode check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add entrypoints/content/index.ts .github/workflows/one-time-align-wxt-mode.yml
          git commit -m "fix: align content script with WXT build mode"
          git push origin HEAD:agent/cleanup-wxt-environment-checks
