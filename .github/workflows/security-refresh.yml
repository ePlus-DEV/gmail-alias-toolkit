name: One-time Security Dependency Refresh

on:
  push:
    branches:
      - chore/security-audit-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v7
        with:
          ref: chore/security-audit-refresh
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install --global yarn@4.14.1

      - name: Install current dependency tree
        run: yarn install --immutable --mode=skip-build

      - name: Audit before refresh
        shell: bash
        run: |
          set +e
          yarn npm audit --recursive --severity moderate | tee /tmp/audit-before.txt
          echo "audit_before_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Refresh known security-sensitive transitive resolutions
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            source-map-js
            brace-expansion
            undici
            ip-address
            browserslist
            postcss
            tar
            minimatch
            picomatch
            @babel/core
            node-forge
            rollup
            defu
            vite
          )

          for package in "${packages[@]}"; do
            echo "::group::Refresh $package"
            yarn up -R "$package" || true
            echo "::endgroup::"
          done

          yarn dedupe --strategy highest
          yarn install --mode=skip-build

      - name: Audit after refresh
        shell: bash
        run: |
          set +e
          yarn npm audit --recursive --severity moderate | tee /tmp/audit-after.txt
          echo "audit_after_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Prepare and validate
        run: |
          yarn exec wxt prepare
          yarn compile
          yarn test
          yarn build
          yarn build:firefox
          node scripts/verify-manifest-scope.mjs
          yarn workspace gmail-alias-toolkit-web build

      - name: Publish audit summary
        shell: bash
        run: |
          {
            echo "## Security refresh"
            echo
            echo "- Audit before exit: \`${audit_before_exit:-unknown}\`"
            echo "- Audit after exit: \`${audit_after_exit:-unknown}\`"
            echo
            echo "### Remaining audit output"
            echo '~~~text'
            tail -n 120 /tmp/audit-after.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/security-refresh.yml

          if git diff --quiet -- yarn.lock package.json web/package.json .github/workflows/security-refresh.yml; then
            echo "No dependency changes were produced."
            exit 0
          fi

          git add yarn.lock package.json web/package.json
          git commit -m "chore(security): refresh vulnerable dependency resolutions"
          git push origin HEAD:chore/security-audit-refresh
