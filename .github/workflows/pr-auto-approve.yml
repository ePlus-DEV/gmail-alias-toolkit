name: pr-auto-approve
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: ${{github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'}}
    steps:
      - name: Verify bot identity
        run: |
          BOT_LOGIN="$(gh api user --jq .login)"
          test "$BOT_LOGIN" = "eplus-bot"
        env:
          GH_TOKEN: ${{secrets.EPLUS_BOT_TOKEN}}

      - name: Approve pull request with comment
        run: gh pr review --approve "$PR_NUMBER" --body "$APPROVAL_COMMENT" --repo "$GITHUB_REPOSITORY"
        env:
          PR_NUMBER: ${{github.event.workflow_run.pull_requests[0].number}}
          APPROVAL_COMMENT: Approved by eplus-bot <bot@eplus.dev> after CI passed.
          GH_TOKEN: ${{secrets.EPLUS_BOT_TOKEN}}
