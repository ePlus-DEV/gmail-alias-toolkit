name: One-time capture development manifest

on:
  push:
    branches:
      - agent/cleanup-wxt-environment-checks

permissions:
  contents: write

jobs:
  capture:
    name: Capture generated manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: agent/cleanup-wxt-environment-checks
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Build development manifest
        run: yarn exec wxt build --mode development

      - name: Capture manifests
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          from pathlib import Path

          output = Path("debug-manifests")
          output.mkdir(exist_ok=True)
          manifests = sorted(Path(".output").glob("*/manifest.json"))
          if not manifests:
              raise SystemExit("No generated manifests found")

          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              target = output / f"{manifest_path.parent.name}.json"
              target.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          Path(".github/workflows/one-time-capture-dev-manifest.yml").unlink()
          PY

      - name: Commit captured manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add debug-manifests .github/workflows/one-time-capture-dev-manifest.yml
          git commit -m "chore: capture generated development manifest"
          git push origin HEAD:agent/cleanup-wxt-environment-checks
