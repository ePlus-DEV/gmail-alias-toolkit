name: Apply PR 46 review fixes

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-pr46-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one occurrence in {path}, found {count}: {old[:80]!r}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "entrypoints/popup/utils.ts",
              '''  return aliases
            .filter((alias) => {
              if (
                opts.viewMode === "favorites" &&
                !opts.favorites.includes(alias.email)
              )
                return false;
              if (
                opts.searchQuery &&
                !alias.email
                  .toLowerCase()
                  .includes(opts.searchQuery.trim().toLowerCase())
              )
                return false;
              if (opts.filterTag !== "all") {
                const tagMatch = alias.email.match(/\\+([^@]+)@/);
                const emailTag = tagMatch ? tagMatch[1] : null;
                if (emailTag !== opts.filterTag) return false;
              }
              return true;
            })
            .sort((a, b) =>
              opts.sortBy === "recent"
                ? b.timestamp - a.timestamp
                : a.email.localeCompare(b.email),
            );''',
              '''  const normalizedSearchQuery = opts.searchQuery.trim().toLowerCase();
            const favoriteEmails = new Set(opts.favorites);

            return aliases
              .filter((alias) => {
                if (
                  opts.viewMode === "favorites" &&
                  !favoriteEmails.has(alias.email)
                )
                  return false;
                if (
                  normalizedSearchQuery &&
                  !alias.email.toLowerCase().includes(normalizedSearchQuery)
                )
                  return false;
                if (opts.filterTag !== "all") {
                  const tagMatch = alias.email.match(/\\+([^@]+)@/);
                  const emailTag = tagMatch ? tagMatch[1] : null;
                  if (emailTag !== opts.filterTag) return false;
                }
                return true;
              })
              .sort((a, b) =>
                opts.sortBy === "recent"
                  ? b.timestamp - a.timestamp
                  : a.email.localeCompare(b.email),
              );''',
          )

          replace_once(
              "tests/popup/utils.test.ts",
              '''  it("accepts dotted gmail username", () => {
            expect(validateEmail("first.last@gmail.com")).toMatchObject({
              isValid: true,
            });
          });

          it("warns but allows non-gmail addresses", () => {''',
              '''  it("accepts dotted gmail username", () => {
            expect(validateEmail("first.last@gmail.com")).toMatchObject({
              isValid: true,
            });
          });

          it("accepts a plus-addressed gmail username", () => {
            expect(validateEmail("user+shopping@gmail.com")).toMatchObject({
              isValid: true,
            });
          });

          it("warns but allows non-gmail addresses", () => {''',
          )

          replace_once(
              "tests/popup/utils.test.ts",
              '''  it("filters by search query (case-insensitive)", () => {
            const result = filterAliases(aliases, {
              viewMode: "all",
              favorites: [],
              searchQuery: "SHOPPING",
              filterTag: "all",
              sortBy: "recent",
            });
            expect(result).toHaveLength(1);
            expect(result[0].email).toBe("user+shopping@gmail.com");
          });

          it("filters by tag", () => {''',
              '''  it("filters by search query (case-insensitive)", () => {
            const result = filterAliases(aliases, {
              viewMode: "all",
              favorites: [],
              searchQuery: "SHOPPING",
              filterTag: "all",
              sortBy: "recent",
            });
            expect(result).toHaveLength(1);
            expect(result[0].email).toBe("user+shopping@gmail.com");
          });

          it("trims the search query once before filtering", () => {
            const result = filterAliases(aliases, {
              viewMode: "all",
              favorites: [],
              searchQuery: "  WORK  ",
              filterTag: "all",
              sortBy: "recent",
            });
            expect(result).toHaveLength(1);
            expect(result[0].email).toBe("user+work@gmail.com");
          });

          it("filters by tag", () => {''',
          )

          replace_once(
              "README.md",
              "Current version: `1.2.0`",
              "Current version: `1.3.0`",
          )

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "- Resolved all DeepSource code quality warnings (24 issues)\n"
          additions = (
              "- Optimized alias filtering by normalizing search input once and using a set for favorites\n"
              "- Added regression coverage for plus-addressed Gmail validation and trimmed searches\n"
              "- Removed generated TypeScript build-info files from version control\n"
          )
          if additions not in changelog_text:
              if changelog_text.count(marker) != 1:
                  raise SystemExit("Unable to locate CHANGELOG insertion point")
              changelog.write_text(
                  changelog_text.replace(marker, marker + additions, 1),
                  encoding="utf-8",
              )

          gitignore = Path(".gitignore")
          gitignore_text = gitignore.read_text(encoding="utf-8")
          if "*.tsbuildinfo" not in gitignore_text.splitlines():
              gitignore.write_text(
                  gitignore_text.replace("web/dist/\n", "web/dist/\n*.tsbuildinfo\n", 1),
                  encoding="utf-8",
              )

          build_info = Path("web/tsconfig.tsbuildinfo")
          if build_info.exists():
              build_info.unlink()
          PY

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Commit reviewed fixes
        shell: bash
        run: |
          rm .github/workflows/apply-pr46-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/popup/utils.ts tests/popup/utils.test.ts README.md CHANGELOG.md .gitignore web/tsconfig.tsbuildinfo .github/workflows/apply-pr46-review-fixes.yml
          git commit -m "fix: address PR review findings"
          git push origin HEAD:dev
